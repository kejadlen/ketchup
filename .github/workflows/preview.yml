name: Preview

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number }}
  cancel-in-progress: true

env:
  FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
  FLY_REGION: sjc
  FLY_ORG: personal

jobs:
  snapshots:
    name: Snapshots
    if: github.event.action != 'closed'
    runs-on: macos-latest
    permissions:
      contents: read # checkout and download baseline from release
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@145243922b4465b78e04dd66294782c7de45901f # v1.345.0
        with:
          bundler-cache: true
      - name: Capture snapshot diff
        run: |
          bundle exec rake snapshots:diff
          snapshot_dir="${XDG_CACHE_HOME:-$HOME/.cache}/ketchup/snapshots"
          tar czf snapshots.tar.gz -C "$snapshot_dir" .
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: snapshots
          path: snapshots.tar.gz

  preview:
    name: Preview
    needs: snapshots
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout
    concurrency:
      group: pr-${{ github.event.number }}
    environment:
      name: pr-${{ github.event.number }}
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - if: github.event.action != 'closed'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: snapshots

      - name: Unpack snapshots into public/
        if: github.event.action != 'closed'
        run: |
          mkdir -p public/snapshots
          tar xzf snapshots.tar.gz -C public/snapshots
          cp public/favicon.svg public/snapshots/

      - uses: superfly/flyctl-actions/setup-flyctl@98172f70657cb3e15db199af139be99bd3e61200 # master

      - name: Deploy preview
        id: deploy
        uses: superfly/fly-pr-review-apps@5d9f067254bebd0aaa77d908d6337b63f4d4f019 # 1.6.0
        with:
          config: fly.preview.toml
          memory: 256
